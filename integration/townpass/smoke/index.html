<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodeFest 測試環境</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #112629; background: #edf8fa; }
    body { max-width: 42rem; margin: auto; padding: 1.25rem; font-size: 18px; line-height: 1.6; }
    h1 { font-size: 28px; line-height: 1.3; }
    section { background: white; padding: 1rem; border-radius: .75rem; margin-block: 1rem; }
    button { display: block; width: 100%; min-height: 52px; margin-block: .75rem; padding: .6rem; border: 0; border-radius: .5rem; background: #22474e; color: white; font: inherit; }
    button:disabled { opacity: .5; }
    button:focus-visible { outline: 3px solid #b26b00; outline-offset: 3px; }
    #status { font-weight: 600; }
    code { overflow-wrap: anywhere; }
    li { margin-block: .4rem; }
    small { font-size: 15px; }
  </style>
  <script type="module" src="/bridge.js"></script>
</head>
<body>
  <h1>CodeFest 測試環境</h1>
  <p>檢查城市通 App 與微服務網頁的連線。這是本地診斷頁，尚未包含北車導航功能。</p>
  <section>
    <h2>連線狀態</h2>
    <p id="status" role="status">正在檢查 flutterObject…</p>
    <p>本地網頁已載入。<code>http://127.0.0.1:8765</code></p>
    <button id="probe" disabled>測試 App 回覆</button>
    <button id="scan" disabled>開啟原生 QR 掃描</button>
    <small>不取得帳號、GPS、通知或麥克風。裝置回覆只顯示型別，不顯示識別值；QR 只顯示是否收到字串，不保存內容。模擬器不能代替實機相機驗收。</small>
  </section>
  <section>
    <h2>檢查紀錄</h2>
    <ol id="events" aria-live="polite"></ol>
  </section>
  <p><small>一般瀏覽器沒有 App bridge，會明確顯示不可用，不回傳假的成功結果。頁面無外部字型、套件、API 或 CDN。</small></p>
</body>
</html>
