name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
env:
  DEPLOY_DIR: /home/user/Taipei-Codefest-2026-Big-Dumb

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Pull latest changes
        run: |
          cd "$DEPLOY_DIR"
          git pull --ff-only

      - name: Validate Compose configuration
        run: |
          cd "$DEPLOY_DIR"
          docker compose config --quiet

      - name: Start services
        run: |
          cd "$DEPLOY_DIR"
          mkdir -p .models
          docker compose up -d --build --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/ > /dev/null && curl -fsS http://localhost:8001/ > /dev/null; then
              echo "service is up"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=50
          exit 1
