name: Android host integration

on:
  pull_request:
    paths:
      - integration/townpass/test-env.patch
      - .github/workflows/native-android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare official pinned sources and integration patch
        run: |
          git clone --filter=blob:none https://github.com/taipei-doit/TownPass.git "$RUNNER_TEMP/TownPass"
          git -C "$RUNNER_TEMP/TownPass" checkout c8e5d4d3f8f699f3d9d6cd68e129ed4da12037b3
          git -C "$RUNNER_TEMP/TownPass" apply --check "$GITHUB_WORKSPACE/integration/townpass/test-env.patch"
          git -C "$RUNNER_TEMP/TownPass" apply "$GITHUB_WORKSPACE/integration/townpass/test-env.patch"
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Verify preinstalled stable NDK (no preview license acceptance)
        run: |
          test -f "$ANDROID_HOME/ndk/29.0.14206865/source.properties"
          cat "$ANDROID_HOME/ndk/29.0.14206865/source.properties"
      - name: Bundle the web application for on-device loading
        run: |
          npm ci --prefix app
          npm run build --prefix app
          python3 tools/package-townpass-web.py "$RUNNER_TEMP/TownPass/assets/codefest_web.bundle"
      - name: Resolve and generate official host code
        working-directory: ${{ runner.temp }}/TownPass
        run: |
          flutter config --no-analytics
          flutter pub get
          dart run build_runner build
      - name: Test chat bridge and QR session
        working-directory: ${{ runner.temp }}/TownPass
        run: flutter test test/codefest_ai_handler_test.dart test/codefest_scan_session_test.dart test/gemma_model_store_test.dart test/codefest_ai_scope_test.dart test/codefest_bundle_server_test.dart --no-pub
      - name: Build Android debug APK (no model weights or signing secrets)
        working-directory: ${{ runner.temp }}/TownPass
        run: flutter build apk --debug --no-pub
