server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Tunnel terminates HTTPS and reaches this origin on port 8001.
    # Only published immutable files are exposed; no HF credentials exist here.
    location = /models/gemma3-1b-it-int4.litertlm {
        alias /srv/models/gemma3-1b-it-int4.litertlm;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
    location ~ ^/models/(receipt\.json|GEMMA_TERMS\.txt|PROHIBITED_USE_POLICY\.txt|NOTICE)$ {
        root /srv;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
    location /models/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
